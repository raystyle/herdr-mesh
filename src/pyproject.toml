[project]
name = "prim"
version = "3.2.1"
description = "六原语 CLI:agents/shares/streams/tasks/pipes/ctx (uv python 跨系统形)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.scripts]
agents = "prim.cli:agents_main"
shares = "prim.cli:shares_main"
streams = "prim.cli:streams_main"
tasks = "prim.cli:tasks_main"
pipes = "prim.cli:pipes_main"
ctx = "prim.cli:ctx_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prim"]
