[project]
name = "prim"
version = "3.1.2"
description = "agent mesh 命令行:agents/shares/streams (uv python 跨系统形)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.scripts]
agents = "prim.cli:agents_main"
shares = "prim.cli:shares_main"
streams = "prim.cli:streams_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prim"]
